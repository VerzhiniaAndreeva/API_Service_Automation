# Every value can be overridden with -D<key>=value or an env var (dots -> underscores, upper-case)
service.base.url=http://localhost:8080
service.api.key=test-api-key
kafka.bootstrap.servers=localhost:29092
kafka.topic.requests=email.send.requested
kafka.topic.events=email.events
# true: framework starts/stops docker compose itself. false: environment already running (CI, shared env)
env.manage=true
env.compose.file=docker/docker-compose.yml
await.timeout.seconds=30
